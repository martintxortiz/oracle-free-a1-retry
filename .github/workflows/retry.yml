name: retry-a1

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Minutes to keep retrying in this run"
        default: "50"

concurrency:
  group: oracle-a1-retry
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Retry launch
        id: grab
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_AD: ${{ secrets.OCI_AD }}
          MAX_MINUTES: ${{ inputs.max_minutes || '50' }}
          INTERVAL_SECONDS: "65"
        run: |
          set +e
          python grab_a1.py
          rc=$?
          if [ $rc -eq 2 ]; then echo "no capacity this run"; exit 0; fi
          if [ $rc -eq 0 ]; then echo "done=true" >> "$GITHUB_OUTPUT"; fi
          exit $rc
      - name: Disable this workflow after success
        if: steps.grab.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable retry.yml --repo "$GITHUB_REPOSITORY" || echo "could not disable workflow"
